name: Fon Alarmlari

on:
  schedule:
    # UTC saatleri (TR = UTC+3). Hafta ici:
    - cron: "0,30 7-14 * * 1-5"   # 10:00-17:30 TR arasi her 30 dk alarm kontrolu
    - cron: "45 15 * * 1-5"        # 18:45 TR gun sonu ozeti
    - cron: "30 16 * * 1-5"        # 19:30 TR yedek ozet (ilki basarisizsa)
  workflow_dispatch:
    inputs:
      mod:
        description: "kontrol veya ozet"
        default: "kontrol"

permissions:
  contents: write

jobs:
  alarm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Kutuphaneleri kur
        run: pip install requests pandas yfinance pdfplumber

      - name: Modu belirle
        id: mod
        run: |
          if [ "${{ github.event.schedule }}" = "45 15 * * 1-5" ] || [ "${{ github.event.schedule }}" = "30 16 * * 1-5" ]; then
            echo "mod=ozet" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.mod }}" ]; then
            echo "mod=${{ github.event.inputs.mod }}" >> $GITHUB_OUTPUT
          else
            echo "mod=kontrol" >> $GITHUB_OUTPUT
          fi

      - name: Alarm scriptini calistir
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python alarm_kontrol.py ${{ steps.mod.outputs.mod }}

      - name: Alarm durumunu kaydet (ayni alarm gunde 1 kez)
        run: |
          git config user.name "alarm-bot"
          git config user.email "alarm-bot@users.noreply.github.com"
          git add alarm_durum.json fon_snapshot.json || true
          git commit -m "alarm durumu" || echo "degisiklik yok"
          git push || echo "push gerekmiyor"
